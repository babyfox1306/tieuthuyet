ending_book1: 'The complete evidence is published once, irrevocably. Renn is forced
  to state his authorship on a live record before the release, so the document cannot
  be dismissed as fabrication. He does not die theatrically — he is arrested at the
  inquiry table he built, which is worse: the instrument of his laundering becomes
  the instrument of his exposure. Sol, Vance, and the Marek file are all real and
  all accounted for — Iris does not trade the lower tiers for the top; the record
  names everyone, in order, including herself where her early cooperation unwittingly
  served the design. She signs the true finding. Sixty-three names are entered into
  a cause-of-collapse verdict that finally fits the physical evidence.


  Epilogue, months later: the reopened prosecutions, the fate of the Vantor contracts,
  and one quiet scene of Iris back in the field — coring a different structure, reading
  it honestly, the habit that started the case now just her work again. Not triumph.
  A record that exists.'
hook_book2: The fast-track authorization named a private stake — and the stake had
  co-owners. Renn built the ladder, but someone financed it, and that name was redacted
  from the one page Iris never recovered. The core sample proved how the tunnel failed.
  It did not prove who else profited. Someone in those redactions is already rebuilding
  the next contract.
notes: '22 chapters. Vagabond-style rebuild. Institutional × corporate conspiracy
  thriller. Single third-limited POV. 4 villain tiers, 2 sequential false answers,
  ONE central-mystery answer. Pure thriller — NO romance, NO spice.


  Design law (from kill-me post-mortem): the blanks were the problem, not the prose.
  Every tier, every false answer, every betrayal has WHO / planted-from-chapter /
  revealed-at-chapter / locked wording. No blanks.


  Accepted operator risk: four tiers + two false answers = more name/relation axes
  than kill-me. Three engine fracture points already locked: (1) tier-order collapse
  — chapter map is canon; (2) Sol=top drift — FA2 must be lifted, Sol stays coordinator;
  (3) Renn careless drift — Rook-analog rule is hard line; Iris wins via the off-registry
  core sample.


  Suggested QA beyond the usual eight: continuity gate on reveal order (tier N before
  N-1 = BLOCK); answer_phrases_forbidden_before_reveal from forbidden_phrases; block
  ''truth is out / evidence public'' before ch21 (whitelist ch13 partial).


  This is concept, not plan. Mark ready only after operator review.


  AUTHORSHIP UNLOCK LADDER (operator lock): ch17–18 anonymous state fast-track + inquiry
  cover; ch19 Renn+fast-track; ch20 Renn+override/burial/built-inquiry via canonical.
  Machine: forbidden_phrase_gates inquiry_cover@18, renn_fasttrack@19, renn_architect@20.'
