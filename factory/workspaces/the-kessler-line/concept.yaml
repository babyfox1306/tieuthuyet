- Renn becoming careless, forgetful, or stupid to advance the plot (Rook-analog rule)
- Any character explaining the mystery in a monologue or confession paragraph
- The core sample as a document, drive, file, or anything searchable in a registry
  — it is physical, off-book
- Any chapter before 21 claiming the truth is out, the evidence is public, or the
  case is fully exposed (except ch13 partial telemetry, cause only)
