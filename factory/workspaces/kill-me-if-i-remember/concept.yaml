concept_status: ready
concept_schema_version: 2
target_language: en
title: Kill Me If I Remember
logline: A firearms investigator wakes on a rooftop beside her sister's body with
  three months missing from her mind, and the masked assassin standing over her says
  she hired him — then hands her a contract in her own handwriting that orders her
  death at sunrise, while the hidden condition governing that order remains buried
  with Rook.
author_directive: 'LEADS


  Sloane Mercer, 30. Federal firearms investigator. Her need for control sounds like

  relentless factual questions, sharpest when the answers threaten to make her a stranger

  to herself. Tic: when frightened she traces a small circle against the inside of

  her left wrist, unaware it is the first motion of a firing sequence. Boundary: she

  will never knowingly trade another life for her own — yet saving her sister requires

  reactivating the system that turned deaths into transactions. Her internal voice

  is sharp and sarcastic. She is never soft, never begging, never rescued at the climax.

  She reads evidence; she does not receive explanations.


  Lucian Vey, 35. Contract assassin. Former lover. His control slips into frightening

  tenderness — every quiet endearment reveals knowledge of a woman Sloane cannot remember

  being. Tic: before obeying an order he hates, he turns the rifle''s focus ring exactly

  one quarter rotation away from clarity. Boundary: he never breaks a contract accepted

  with full knowledge — yet loving her forces him to choose whether her forgotten

  command deserves more loyalty than the woman in front of him. He is terse. He does

  not explain. When he withholds, the reader must feel the cost of the withholding.


  SUPPORTING — exactly two, no more


  Mara Mercer — younger sister. ALIVE. She consented to the staged shooting because

  Sloane''s plan required the death to look real even to Sloane. She signals through

  the rifle scope at ch11. Her hand rhythm carries the true firing sequence at ch12.

  She is captured at ch14. She is the mirror key at ch16-17.


  Cassian Rook — former handler. He altered seven target files so Lucian unknowingly

  eliminated the witnesses who could expose his private weapons network. He is not

  omniscient and he is not stupid. He loses because Sloane out-thinks him, not because

  the plot briefly removes his intelligence. Every time he wins, it must be because

  he prepared. Every time he loses, it must be because she was faster.


  SURFACE ORDER vs BINDING CONDITION — TWO OBJECTS, ONE EVENT


  Surface order (visible from chapter 1): exact contract line

  CLIENT TERMINATION AT SUNRISE

  It may appear unconditional. Early chapters may quote it and react to the apparent

  sunrise execution order. They must NOT state or paraphrase the Rook trigger.


  Binding condition (reveal from chapter 10):

  Lucian must kill Sloane at sunrise only if Rook restores the obedient identity.

  Before chapter 10 this full condition is forbidden. From chapter 10 onward, when

  (and only when) the binding condition is explicitly stated, use that exact wording
  —

  do not invent memory-recovery shorthands. Do not require restating the full binding

  on every sunrise mention after reveal.


  See structured fields surface_order / binding_condition / forbidden_phrases.


  TIME — ONE NIGHT, NOTHING ELSE


  Opens shortly after midnight. Ends at sunrise. Roughly five hours, continuous. No

  daylight, no evening, no second night, no meals, no sleep. No appointment set for

  midnight — midnight has already passed. The sun rises only in the final chapter.


  THE STAGED DEATH — HOW, EXACTLY


  Frangible round, shoulder graze, blood pack under the jacket. Lucian rehearsed the

  one safe angle until he could hit it blind. Sloane must NEVER physically reach the

  body. She sees it from several meters. Lucian blocks her approach; Rook''s first

  move forces them off the roof before she closes the distance. She is a firearms

  investigator — if she touches that body, the twist becomes a cheat.


  THE LEDGER — RELEASED ONCE


  Chapter 13: she broadcasts a decoded fragment. Enough to expose the shape of Rook''s

  operation. Not enough to satisfy the binding condition.


  Chapter 16: she reaches Mara and gets the mirror key, but Rook seizes the relay.

  Nothing transmits.


  Chapter 17: the complete ledger goes out ONE time, and only after she breaks the

  conditioning in front of Rook. That is the only publication. It cannot be recalled.


  No other chapter may claim the truth is out.


  THE MIRROR KEY — A BODY, NOT AN OBJECT


  The final piece is Mara''s hand rhythm. The same sequence used at ch11, ch12, ch14,

  ch15. It is not paper. It is not a document. It is not a written code, a drive,

  or anything a person can be searched for. Rook cannot search a reflex out of a body.

  That is the whole point of the design, and the reason Sloane hid the ledger the

  way she did.


  POV — DUAL, AND ACTUALLY DUAL


  Third-person limited. Sloane holds most chapters. Lucian holds chapter 5, chapter

  10, and chapter 14.


  Those three chapters must be inside his head — what he is hiding, what the countdown

  feels like from the side of the man holding the gun, what it costs to answer her

  honestly and still not tell her. The reader must fear him and want to trust him

  at the same time. If he only protects and asks permission, he is a bodyguard, not

  a love interest.


  SPICE — LEVEL 3, PLACED IN THE LULL


  Two explicit chapters. Both occur when the guns stop, not while rounds are coming

  through the wall and not while her sister is in a cell. The intimacy is what unlocks

  the conditioning — that mechanic stays — but the danger in those scenes must be

  emotional, not ballistic. If the reader thinks "her sister is captive and they are

  doing this now," the scene has failed.


  HOW THE TRUTH IS EARNED


  Physical evidence and procedural memory. Never a speech.


  Sloane measures, finds, tests, breaks, remembers through her hands. Rook does not

  deliver monologues about his plan. Lucian does not hand her the answer in a paragraph.

  If a character knows something the reader needs, that knowledge must arrive as an

  object, a recording that plays, a reflex that fires, a file she reads herself —

  never as a person explaining.


  The wrist circle appears in every act. It is a clue, not a button. It escalates:

  at first a tic, then a fragment, then a partial sequence, then a weapon, then hers.


  THE TRAP INSIDE THE TRAP


  Rook planned for Sloane discovering his manipulation. Her rebellion was step seven

  of his design — he needed her to erase herself to protect the network. What he did

  not plan for: she found the plan before the erasure and wrote over the ending. This

  is the reveal of chapter 13, and she must assemble it from three pieces of evidence,

  not read it as a summary.

  '
surface_plot: An amnesiac woman spends one night trying to prove she did not order
  her own sister's murder, while the assassin she apparently hired counts down to
  a deadline he refuses to explain. She thinks she is investigating a crime. She thinks
  the man beside her is either her executioner or her only witness. She thinks if
  she can recover her memory before sunrise, she will be free.
true_plot: 'Her handler spent two years feeding her falsified targets so that her
  assassin would eliminate seven witnesses to his private weapons network. When she
  found out, she did not run — she built a trap that required her own destruction.
  She staged her sister''s death as bait, hid the complete transaction ledger inside
  her own conditioned reflexes, erased her memory so no interrogation could reach
  it, and ordered her lover to kill her if the handler ever restored the obedient
  version of her he had trained.


  But the handler had planned for her discovery too. Her rebellion was a step in his
  design. What he did not plan for is that she wrote over his ending. The night is
  not her recovering the truth. It is her executing a plan she can no longer remember
  making, using a body that remembers everything.'
surface_order:
  event_id: sloane_termination_at_sunrise
  exact_text: CLIENT TERMINATION AT SUNRISE
  visible_from_chapter: 1
  appears_unconditional: true
binding_condition:
  event_id: sloane_termination_at_sunrise
  canonical_text: Lucian must kill Sloane at sunrise only if Rook restores the obedient
    identity.
  reveal_chapter: 10
  exact_wording_required_when_explicitly_stated: true
forbidden_phrases:
- if I remember
- if you remember
- if she remembers
- if Sloane remembers
must_include:
- Surface order CLIENT TERMINATION AT SUNRISE may appear from chapter 1; binding condition
  uses exact Rook/obedient-identity wording only from chapter 10 when explicitly stated
- The story opens shortly after midnight and ends at sunrise — one continuous night
- Sloane sees Mara's body from a distance and never physically reaches it
- The complete ledger is published exactly once, in chapter 17, and cannot be recalled
- The mirror key is Mara's hand rhythm — a reflex, not an object
- Lucian holds POV in chapters 5, 10, and 14
- Rook plans for Sloane's discovery — her rebellion is step seven of his design
- Sloane writes over Rook's ending before the erasure; this is the chapter 13 reveal
- The wrist circle appears in every act and escalates from tic to weapon
- Sloane assembles every reveal from evidence she reads, tests, or remembers through
  her hands
- Sloane's guilt is never lifted — she ordered the deaths with full knowledge
- Epilogue confirming Sloane and Lucian still choose each other
must_avoid:
- Any version of the binding condition other than the canonical Rook/obedient-identity
  wording — never memory-recovery shorthands listed in forbidden_phrases
- Sloane touching Mara's body, checking her pulse, or describing her as a corpse,
  as cooling, or as having no pulse
- Any appointment or deadline set at midnight
- Daylight, evening, a second night, sleep, or meals — the whole book is one night
- Any chapter before 17 claiming the truth is out, the evidence is public, or the
  ledger is fully released
- The mirror key as paper, a document, a drive, or any searchable object
- Any character explaining the mystery in a speech
- Lucian revealing the full binding condition before chapter 10
- Lucian telling Sloane she is the ledger, or that the etched lines map Rook's network
- A third supporting character beyond Mara and Rook
- Explicit scenes while under active fire or while Mara is captive
- Sloane being rescued by Lucian at the climax
- Rook becoming careless, forgetful, or stupid so the plot can advance
- Sloane being handed her innocence back
- Rook appearing as a corpse or ghost before chapter 17
- The dead returning to life
- Real people, real organizations, anyone under 18
ending_book1: 'The complete ledger is published — once, irrevocably. Rook dies reaching
  for the rifle he trained her to use. Mara is free. Sloane releases her own seven
  contracts alongside the evidence: she does not buy absolution, she chooses the record.
  She is arrested and accepts it. Lucian is offered the only extraction route and
  refuses it, standing beside the woman he was contracted to kill.


  Epilogue, months later: her sentence, Mara''s testimony, Lucian''s status, and one
  scene that confirms they still choose each other. Not a wedding. Not safety. A future
  that exists.'
hook_book2: The network Rook fed did not die with him. The ledger named everyone —
  including the people who paid. Someone in those pages has Lucian's contract file,
  and the condition that binds him did not end when Rook did.
notes: 'This is a rebuild. Version 1 (workspace: his-final-target) shipped 17 chapters
  and broke in six places — all six because the concept left a field blank and the
  model filled it differently each chapter.


  1. The clause was stated three contradictory ways. v2 fix: split surface_order vs
  binding_condition with shared event_id — not merely "one wording forever / every
  chapter that touches".

  2. Timeline opened at dawn, set a midnight appointment, then ran pre-dawn for seven
  chapters. Fix: one night, no midnight.

  3. Sloane checked Mara''s pulse and found none — then ch14 revealed a shoulder graze.
  Fix: she never touches the body.

  4. The ledger was published three times, each declaring victory. Fix: fragment ch13,
  once at ch17.

  5. Declared dual POV, delivered 17/17 chapters in Sloane''s head. Fix: ch5/10/14
  are Lucian''s.

  6. NOBODY MONOLOGUES was written as prose guidance; the outliner read it and ignored
  it. Lucian explained the central mystery in chapter 3. Fix: it is in Must avoid,
  as a line, with the specific beats named.


  Keep from version 1: Sloane''s voice — sharp, active, never rescued. Lucian as the
  strongest male lead across the line. The scope-mask-wrist-circle motif. The chapter
  1 hook. Project Innocence — the trap that planned for its victim''s rebellion.


  The prose in version 1 was not the problem. The blanks were.'
