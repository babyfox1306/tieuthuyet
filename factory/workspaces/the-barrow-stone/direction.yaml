book1_ending: Marget strikes the central stone. The network dies. The raven has nowhere
  to land. And the hands that struck the blow feel nothing — not the mallet, not the
  shattered slate, not the cold that was the last of Oswin. She walks out of the barrow
  across ground she can no longer read, carrying a grief she cannot put her hands
  on. The threat is ended. She freed him with the last thing she ever felt, and she
  will never know whether he wanted to be freed.
blurb: A stone restorer who reads the dead through her fingertips is hired to clean
  a sunken moorland graveyard — and discovers the only way to free her mentor from
  the thing beneath it is to shatter the stone that holds him, with the same hands
  that will never feel anything again.
