concept_status: ready
target_language: en
title: The Bell Names the Dead
logline: Every night at 2:17, a bell removed from its tower rings for one person in
  Morrow Wick. By sunrise, that person will repeat the previous victim’s final hours,
  uncover one fragment of a buried massacre, and write the name of whoever must die
  next.
author_directive: 'Write a ten-chapter gothic psychological horror novella set during
  five winter days in the isolated English town of Morrow Wick in 1998.


  The protagonist is Elena Voss, thirty-three, a municipal death-records clerk who
  returned home after the death of her mother, Ada. Elena is practical, emotionally
  restrained, highly observant, and distrustful of supernatural explanations. She
  trusts dates, signatures, paper records, physical evidence, and procedural consistency.
  Use close third-person POV limited entirely to Elena.


  The central location is the condemned Saint Orison’s Church. Its bell was removed
  after a fire in 1974, but selected victims still hear it ring at exactly 2:17 a.m.


  THE LOOP RULES:


  1. After hearing the bell, the named victim has until sunrise the following day.

  2. The victim compulsively reenacts the previous victim’s final sequence of movements,
  purchases, spoken phrases, and physical actions.

  3. Every reenactment contains one deliberate deviation. That deviation reveals a
  new sensory memory from the 1974 fire.

  4. Shortly before death, the victim writes the next person’s full name in soot on
  a wall, floor, mirror, document, or their own skin.

  5. The next name is never random. The named person possesses knowledge, access,
  ancestry, or evidence required to advance the buried testimony.

  6. Leaving Morrow Wick does not stop the loop. The victim unconsciously returns
  by a different route.

  7. Physically restraining a victim causes nearby people to perform fragments of
  the reenactment.

  8. The named victim dies at sunrise unless the testimony chain is completed before
  the final bell.

  9. The loop cannot invent facts. Every revealed detail must correspond to physical
  evidence later discovered.

  10. Each cycle must escalate differently. Do not repeat the same death staging,
  investigation rhythm, location, or emotional response.


  In 1974, seven children were secretly locked beneath the church during an illegal
  disciplinary ritual conducted by respected town officials. A fire broke out upstairs.
  The officials saved the building records and abandoned the children. Town registrar
  Edmund Rusk removed their names from the death register, listed them as runaways,
  and sealed the lower chamber behind a false stone wall.


  Ada Voss discovered the falsified records decades later. She attempted to restore
  the children’s names but lost her nerve after Gideon Rusk, Edmund’s son and the
  current town archivist, threatened Elena. Ada altered one page of the register so
  that Elena would eventually become the final witness rather than another disposable
  victim.


  Gideon Rusk is the human antagonist. He understands part of the loop and has spent
  years moving documents, suppressing death certificates, and redirecting suspicion.
  He did not create the supernatural mechanism and cannot fully control it. Do not
  reveal his knowledge or Ada’s alteration before the locked chapters.


  The horror must come from repetition with mutation: familiar actions acquiring new
  meaning, strangers speaking dead people’s private words, official documents changing
  through physical additions rather than magical rewriting, and Elena slowly recognizing
  her mother’s habits inside the victims’ reenactments.


  No romance. No spice. No comic relief character. Violence should be disturbing but
  controlled, with emphasis on anticipation, bodily compulsion, ash, wet stone, old
  paper, cold metal, and the loss of personal agency.


  Plant every major reveal through records, architecture, victim deviations, witness
  contradictions, or recurring objects. The final solution must follow the established
  loop rules. No sudden ritual, artifact, relative, ghost, or historical fact may
  appear only in the final two chapters.


  The emotional core is Elena deciding whether protecting her dead mother’s reputation
  matters more than restoring the identities of seven forgotten children.'
surface_plot: Municipal records clerk Elena Voss investigates a chain of ritual deaths
  in which each victim reenacts the final actions of the person before them. When
  her own name appears beside the latest body, she has one night to decode the pattern
  and stop the bell before sunrise.
true_plot: The deaths are not a random curse and the bell is not choosing sinners.
  The loop is an unfinished chain of testimony created by seven children who died
  beneath Saint Orison’s Church in 1974 and were erased from the town’s official records.
  Each victim is forced to carry one fragment of their final memory to the next person
  capable of exposing the truth. Elena is not the final sacrifice. She is the final
  witness.
must_include:
- A removed church bell heard at exactly 2:17 a.m.
- A clear and testable victim-loop rule system
- At least four completed victim cycles
- One unique deviation in every cycle
- Each deviation reveals a fragment of the 1974 event
- Physical records that support every supernatural revelation
- A sealed chamber beneath Saint Orison’s Church
- Seven erased children
- Ada Voss’s hidden correction page
- Gideon Rusk obstructing the investigation
- Elena’s name appearing before the midpoint ends
- A failed attempt to restrain one victim
- A victim reenactment occurring in a public place
- A chapter in which Elena begins reenacting the previous victim
- The true purpose of the loop revealed no earlier than Chapter 8
- The full truth about Ada revealed in Chapter 9
- A rule-based solution completed before sunrise
- The current case fully closed in Chapter 10
- A final hook pointing toward Saint Agnes in Black Fen
- A strong final line
must_avoid:
- Random victim selection
- Ten chapters built around ten identical deaths
- A serial killer secretly staging every supernatural event
- A demon controlling the bell
- A magical object introduced near the ending
- Ghosts explaining the full mystery directly
- Dream sequences that reveal factual information
- Possession that erases the victim’s personality
- A hidden twin
- A secret sibling
- A romance subplot
- Sexual content
- Comedic banter during horror scenes
- Police arriving to solve the central mystery
- Elena surviving because the curse simply changes its mind
- Gideon confessing the entire truth in a monologue
- A final twist that contradicts the loop rules
- An ambiguous ending about whether the case was real
- A sequel hook that leaves the Saint Orison case unresolved
ending_book1: 'Elena enters the sealed chamber beneath Saint Orison’s before sunrise
  and finds the remains of the seven children, the original attendance ledger, and
  Ada’s hidden correction page.


  Gideon attempts to burn the evidence and stop Elena from reading the children’s
  names. Elena has already mailed copies of the recovered records to three outside
  authorities. She completes the chain by entering all seven names into the official
  death register and reading them aloud beneath the empty bell frame.


  The final bell does not ring. Elena survives sunrise.


  The remains are recovered, the 1974 deaths are formally recorded, Gideon is arrested
  after attacking Elena, and Ada’s role is exposed: she discovered the truth, concealed
  it for years, and finally altered the register to give Elena one chance to finish
  what she could not.


  The immediate victim loop ends completely. The Saint Orison case is solved.'
hook_book2: 'While cataloguing the restored ledger, Elena discovers an eighth entry
  written in ink that is still wet:


  SAINT AGNES, BLACK FEN — ELEVEN NAMES UNRETURNED.


  That night, a telephone rings inside the disconnected church office. When Elena
  answers, a child asks whether Morrow Wick has finally learned how to keep the names
  of its dead.'
notes: '10 chapters

  Target: 10 chapters, 18,000–24,000 words.


  Chapter 1: Daniel Wren is found dead outside Saint Orison’s with burned feet on
  frozen ground. He has written MIRIAM COLE in soot.


  Chapter 2: Miriam begins repeating Daniel’s final day. Elena verifies impossible
  details and finds a missing section in the 1974 death register.


  Chapter 3: Miriam’s deviation reveals children coughing beneath a wooden floor.
  She dies and writes THOMAS REED.


  Chapter 4: Thomas reenacts Miriam publicly inside the municipal archive. His deviation
  identifies a bricked passage omitted from the church plans.


  Chapter 5: Elena and local doctor Mara Keene restrain Thomas. The compulsion spreads
  through the archive staff. Thomas escapes, reaches the church, dies, and writes
  NORA PELL.


  Chapter 6: Nora attempts to leave Morrow Wick but repeatedly returns. Her cycle
  reveals that town officials heard the trapped children and chose not to open the
  chamber. Before dying, she writes ELENA VOSS.


  Chapter 7: Elena enters the loop and repeats Nora’s movements while remaining mentally
  aware. She uses the reenactment to locate Ada’s hidden correction page.


  Chapter 8: Elena discovers that the bell does not choose victims. Each victim names
  the next necessary witness. Gideon’s active obstruction becomes clear.


  Chapter 9: Elena learns Ada’s full role, finds the sealed chamber, and realizes
  the seven names must be restored before sunrise. Gideon attempts to destroy the
  evidence.


  Chapter 10: Elena completes the official record, reads the names, survives sunrise,
  closes the Saint Orison case, and discovers the Saint Agnes entry.


  Every chapter must change the reader’s understanding of at least one previous scene.
  End Chapters 1–9 with a concrete new fact, action, name, location, or rule consequence—not
  a vague feeling.'
