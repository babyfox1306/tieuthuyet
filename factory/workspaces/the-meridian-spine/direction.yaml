book1_ending: 'The tool-mark proof is published once, irrevocably. Marsh is forced
  to state his role on live record before release, then arrested -- the reform he
  built becomes the instrument of his exposure, exactly as the inquiry did to Renn
  (rhyme, escalated). Halveston, Okafor, Lund all real, all accounted for, named in
  order. Iris resigns the Directorate rather than inherit a captured institution,
  and enters the true finding. She does not save the Directorate; she chooses the
  record over the office. Epilogue: Directorate dissolved or reconstituted; Iris back
  in the field -- but the reader knows the redacted page named co-owners, and one
  of them was never on any live record.'
blurb: A year after she brought down the commissioner behind the Kessler collapse,
  forensic engineer Iris Kane is handed the flagship job of the reform built to prevent
  the next disaster -- and discovers the reform itself is the instrument by which
  the people who financed Renn are capturing national infrastructure wholesale, protected
  by a name redacted from the one page she never recovered.
