must_avoid:
- Any tier revealed out of order, or two tiers collapsed into one reveal
- Any false answer presented as merely a frame -- each culprit is genuinely guilty
  of their own act
- Marsh becoming careless, forgetful, or stupid to advance the plot (Rook-analog rule)
- Any character explaining the mystery in a monologue or confession paragraph
- Reusing Book 1 core sample as the Book 2 winning card
- Any chapter before 21 claiming the truth is out or evidence is fully public (except
  ch13 partial tool-mark match, names no one)
- Okafor revealed as betrayer before chapter 10
- Halveston revealed as anything above coordinator -- he financed; he did not architect
- A fifth villain tier, or supporting cast beyond Lund, Okafor, Halveston, Marsh (+
  Renn source)
- Reviving Sol, Vance, or Marek as active plot engines
- Freeing or exonerating Renn; making him the Book 2 top
- Any romance subplot or explicit content -- spice 0
- Real people, real organizations, real named agencies, anyone under 18
- 'Before chapter 18: stating the reform/Directorate is a capture instrument / trap'
- 'Before chapter 19: attaching Marsh (or any personal name) to architecting the capture'
- 'Before chapter 20: Marsh + architected the capture / ordered / laundered -- ch19
  may name Marsh + created-Directorate + benefits only'
- Treating Halveston as the final mastermind (FA2 must be lifted)
- 'Beat-cloning Book 1: leaked-finding betrayal, inquiry-as-cover as the new trap,
  single retained sample spine'
ending_book1: 'The tool-mark proof is published once, irrevocably. Marsh is forced
  to state his role on live record before release, then arrested -- the reform he
  built becomes the instrument of his exposure, exactly as the inquiry did to Renn
  (rhyme, escalated). Halveston, Okafor, Lund all real, all accounted for, named in
  order. Iris resigns the Directorate rather than inherit a captured institution,
  and enters the true finding. She does not save the Directorate; she chooses the
  record over the office. Epilogue: Directorate dissolved or reconstituted; Iris back
  in the field -- but the reader knows the redacted page named co-owners, and one
  of them was never on any live record.'
hook_book2: Marsh architected; the fund financed; but the redacted page named a foreign
  counter-signatory -- the capture was never only national. The tool-mark that linked
  three domestic frauds also appears on a contract Iris has no jurisdiction to touch.
  The ladder does not stop at a country's edge.
