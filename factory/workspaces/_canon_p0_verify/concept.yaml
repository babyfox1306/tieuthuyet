  role: protagonist / Alibi Architect / hidden mastermind
- name: Adrian Thorne
  role: antagonist and love interest / Claire's husband / digital predator
- name: Claire Thorne
  role: victim / Adrian's wife / absent corpse
- name: Det. Miller
  role: incidental investigator / alibi verifier / Book 2 hook
