book1_ending: 'Nora recovers the full memory of the summer she was seven: Della was
  her twin, Della drowned in the tidal pool while Nora stood frozen and silent, and
  afterward the whole family agreed to erase Della to survive the grief. Nora makes
  her choice at the tidal pool — she restores the final tape and says Della''s name
  aloud for the first time in twenty years, choosing to grieve and become whole rather
  than keep forgetting. The central mystery is fully answered: who the voice was,
  why the room stayed cold, why Nora had no memory. Her arc resolves.'
blurb: A sound restorer inherits her grandmother's shuttered seaside hotel and finds
  one room that stays cold in every season — a room she swears she never entered,
  though a child's voice on the old tapes keeps saying her name.
