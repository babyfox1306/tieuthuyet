book1_ending: By the end of Book 1, Lin Wei discovers the marriage contract was never
  a purchase of identity but a shield Adrian Vale built to pull her out of the Glass
  Meridian's reach. She learns her mother was not an ordinary cancer patient but a
  surviving victim of a biotech trial Aurelian Group concealed years ago. Adrian was
  not the one who directly harmed her mother, but he once unknowingly stood inside
  the system that caused the tragedy. Together they break one link of the Meridian
  inside Aurelian Group, pull her mother through the critical phase, and accept that
  the fake marriage has become a real alliance.
blurb: A Chinese investigative journalist signs a one-year marriage contract with
  a cold, dangerous Western CEO to save her dying mother — only to discover the marriage
  is a trap pulling her into a global medical-financial network that has been concealing
  a secret about her own family.
