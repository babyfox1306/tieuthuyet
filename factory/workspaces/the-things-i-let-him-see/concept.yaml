chapter_map:
  '1': 'The Contract. Grant hires Calder for a 21-day assignment ending on the settlement

    date; provides common-area camera access and the courtyard apartment. Calder

    activates his local archive and handwritten notebook; Grant receives only compressed

    reports. Primary turn: Calder accepts and creates an evidence channel Grant does
    not

    fully control.

    '
  '2': 'The Baseline. Calder records Lena''s ordinary routine. After her walk she
    finds a

    kitchen mug moved; Grant messages moments later asking if she forgot something.

    Primary turn: Grant establishes Lena''s alleged instability as Calder''s baseline.

    '
  '3': 'The Reflection. The status light from Calder''s courtyard camera reflects
    in his dark

    window. Lena pauses, looks first at the visible camera then at Calder''s window,
    and

    continues. Canonical: Lena detects the observer here; prose does not explain it.

    Primary turn: Calder reads her pause as instinct and becomes personally invested.

    '
  '4': 'The Missing Mail. Lena tells Mae a utility notice vanished; Grant later claims
    to

    have found it in shared recycling, framing her as forgetful and accusatory. Mae
    is

    uncertain. Primary turn: Grant converts an ordinary missing letter into

    witness-supported instability.

    '
  '5': 'The Private Copy. Calder watches Lena dance alone in her kitchen through

    common-facing blinds (no nudity, no bedroom/bathroom view). He records it but
    removes

    it from Grant''s report. Lena places a folded red receipt beside the moved mug.

    Primary turn: Calder begins keeping a private version of Lena he withholds from
    Grant.

