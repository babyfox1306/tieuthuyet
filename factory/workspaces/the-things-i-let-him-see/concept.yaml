must_include:
- The folded red receipt appears only in Chapters Three, Five, Eight, Eleven, and
  Fourteen.
- The reflected camera status light appears only in Chapters One, Three, Seven, and
  Fourteen.
- Ordinary displaced objects function as primary evidence only in Chapters Two, Four,
  Seven, and Twelve.
- The phrase 'You keep the originals' appears only in Chapters Nine and Seventeen.
- The phrase 'Friday key return' appears only in Chapters Eight, Twelve, Fifteen,
  and Seventeen.
- The phrase 'Look at me' may appear only in Chapters Nine, Eleven, and Eighteen.
- Explicit sexual content occurs only in Chapters Eleven and Eighteen.
- Chapter Eleven must show the courtyard camera powered off and physically covered,
  then affirmative consent before sexual contact.
- Chapter Sixteen must show Lena withdrawing access and Calder obeying immediately.
- Calder must enter Chapter Seventeen without romantic reconciliation.
- The certified envelope must first function as an information honeytoken; Grant must
  use the unique phrase before Lena learns the theft was recorded.
- Grant must formally authenticate the envelope, clipped corner, checklist, unique
  phrase, and alleged recycling-area custody before Calder reveals contradictory footage;
  Grant must never state that he took the envelope.
- Chapter Seventeen must use the envelope, postal tracking, original archive, field
  notebook, access audit, door-seal planner, reports, contract, and evidence index.
- Calder must transfer the archive duplicate before the climax; Lena must remain the
  designer of the evidentiary sequence; the final curtain image must represent chosen
  visibility.
must_avoid:
- No secret twin, impostor, body double, memory-loss twist, hidden pregnancy, or false
  identity twist.
- No hallucination explanation for Lena's observations.
- No hidden camera inside Lena's apartment; no bedroom or bathroom recording; no recording
  of nudity or sexual activity.
- No sexual assault presented as romance; no sexual contact before the Chapter Ten
  rules.
- No gun, knife, kidnapping, physical assault, chase climax, or violent rescue.
- No hacker friend, secret server, unexplained cloud backup, mystery USB drive, or
  surprise forensic device.
- No new evidence introduced after Chapter Fifteen.
- No scene outside Calder's POV; no omniscient action by Grant or Lena.
- No police action based on one recording or accusation; no detective attending the
  confidential settlement without a declared legal reason; no instant arrest during
  the settlement scene.
- No instant divorce judgment, property transfer, or criminal conviction.
- No named character outside the locked cast; no child, pregnancy, or custody subplot.
- No mafia, organized crime, billionaire fantasy, cult, or international conspiracy.
- No redemption for Grant; no revelation that Calder designed Lena's counterstrategy.
- No romance payoff for Calder ignoring Lena's refusal; no Book Two villain physically
  appearing in Book One.
- No version of the climax requiring Grant to confess that he stole the envelope.
- No portrayal of Lena's Chapter Eight action as certainty that Calder recorded the
  envelope theft.
ending_book1: 'Central question: once Lena no longer needs Calder as a witness, is
  anything between them chosen

  rather than engineered? Answer: yes, but only after the surveillance contract, evidence
  dependency,

  and immediate threat have ended. Lena defeats Grant''s control without being physically
  rescued and

  remains in her apartment. Calder gives up sole custody of the evidence, exposes
  his own conduct to

  Detective Cross, and accepts Lena''s refusal to let him decide for her. After those
  actions can no

  longer benefit her case, Lena asks Calder to return without recording equipment;
  she grants no

  unrestricted access and chooses when he enters, when he watches, and when the curtain
  closes. The

  thriller question is also resolved: Lena, not Calder or Grant, controlled the decisive
  sequence of

  visible events.

  '
hook_book2: 'Mae gives Lena a sealed archived complaint from another condominium that
  used the same security

  vendor. The complaint predates Grant''s board position and describes short camera
  gaps paired with

  resident instability reports. Lena does not open it during Book One. Grant remains
  defeated and does

  not secretly control the new problem; no replacement antagonist appears on-page.
  The hook offers a

  future choice: leave the surveillance world behind, or examine whether the mechanism
  existed before

  Grant learned to exploit it.

  '
notes: 'Claustrophobic, intimate, methodical, erotic, and psychologically tense. Fear
  must grow from

  ordinary domestic details: a mug placed at the wrong angle; a door seal broken;
  a missing letter;

  a familiar key used silently; a message arriving too quickly; a repeated phrase
  that should be

  private; a camera light reflected in glass; a checklist returning through another
  person''s mouth.

  Calder''s voice is precise and controlled; his unreliability concerns interpretation,
  not physical

  reality. He may misread Lena''s attraction, fear, intention, his own importance,
  and the relationship

  between access and consent. He may not misreport timestamps, physical evidence,
  spoken phrases, his

  own actions, or custody. Lena must never read as superhuman: every successful move
  arises from a test

  that still yields information if one channel fails, evidence already preserved by
  someone else, or a

  decision made after she receives new information.

  '
