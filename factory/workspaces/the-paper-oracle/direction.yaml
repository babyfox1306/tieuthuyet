book1_ending: 'Iris understands the machine reflects her own hand, not the future.
  Facing a slip with HER OWN name, she breaks the loop: she stops resisting, accepts
  a death she cannot prevent rather than causing one by fighting, and burns the machine.
  She survives. The machine goes silent. Her year-old guilt is resolved — she finally
  knows the truth about that death.'
blurb: A night-shift nurse in a 1994 coastal ER finds a label printer that spits out
  a patient's name and time of death before they walk through the door — and the first
  slip names a child who arrives thirty-five minutes early.
