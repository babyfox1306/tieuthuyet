book1_ending: Sloane is arrested. Mara is alive. Rook's network is exposed. Sloane
  releases her own seven contracts along with the ledger — she does not buy absolution,
  she chooses the record. Lucian is offered the only escape route and refuses it,
  standing beside the woman he was contracted to kill. Dawn fills the empty scope
  with light and leaves nothing hidden behind it. The last feeling is not safety —
  it is chosen loyalty.
blurb: Trapped on a rooftop with the masked assassin she apparently hired to kill
  her own sister, a firearms investigator must recover the memories she ordered erased
  before dawn, when the man who once loved her is contractually bound to expose her
  crimes or execute her.
