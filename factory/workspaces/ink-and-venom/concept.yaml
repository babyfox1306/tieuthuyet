concept_status: ready
target_language: en
title: Ink and Venom
logline: At an isolated alpine sanatorium for chronic pain, a young artist discovers
  the revolutionary "venom therapy" is quietly replacing her body with an invasive
  ink-like vascular structure — and the shimmering remnant of a woman the cure already
  killed is trying to warn her.
author_directive: 'POV: third-limited, locked to Elara Sennewald (24) for the entire
  book. Spice: 1 (no explicit content).


  Male lead: Dr. Alistair Finch (29), clinic director. He is the ANTAGONIST, NOT a
  love interest. Do NOT write any romance, attraction, or caretaker-romance between
  Elara and Finch. His pull on her is authority, false comfort, and the promise of
  a pain-free body — never desire. Finch tic: sips cold tea; his own skin is permanently
  greyish. His secret: his chest is a solid grey mass with black vascular threads
  beneath, revealed in chapter 9.


  Female lead: Elara Sennewald, an artist; tic: rubs her wrists and temples to warm
  them; deepest fear: being restrained or trapped in an enclosed medical device.


  Dead presence: Beatrice (patient who died before Elara arrived, whose art studio
  Elara inherits). Beatrice manifests ONLY as dancing iridescent metallic-shimmer
  light in the studio. She NEVER speaks, NEVER touches, NEVER has a scent — silent
  visual display only.


  Supporting: Nurse Cora (administers the venom on protocol, no true understanding,
  later revealed partly converted). Patient Tobias (friend/patient; knew the treatment
  was a transformation and tried to warn Elara through charcoal drawings; is "cured"
  — disappears — mid-book).


  Central mystery (ONE single answer): the ink is the viable biomass of an ancient
  sentient subterranean organism that consumes and replaces human nervous and circulatory
  systems to build a collective consciousness. Reveal in chapter 9.


  World rules: the venom makes patients allergic to direct pure light but hypersensitive
  to sound and texture; transformation can be halted (never reversed) only by ingesting
  a specific alpine salt the clinic controls; a fully transformed patient sees the
  world as a grid of bio-electrical current, not color.


  Forbidden: no romance of any kind, including with Finch; central mystery must not
  have two answers; Beatrice must never speak or have a scent; no explicit 18+ content.'
surface_plot: Elara Sennewald checks into the Styrian Alp Sanatorium hoping the experimental
  treatment will end her pain, and at first the black threads under her skin look
  like a side effect she can tolerate for relief.
true_plot: The "venom" is the living biomass of an ancient subterranean organism that
  consumes and replaces human nerves and blood vessels to fold each patient into a
  collective consciousness. Dr. Finch runs the clinic because he is already transformed
  and needs new hosts. Beatrice, the dead patient whose room Elara inherited, resists
  absorption enough to flicker as metallic light, and uses it to guide Elara out before
  the change completes.
must_include:
- Slow body-horror escalation every chapter
- Visual cliffhanger at the end of each chapter
- Recurring signature image of black threads under white skin / metallic shimmer /
  ash
- Reveal cadence spread evenly every 2-3 chapters
must_avoid:
- Romance or attraction between Elara and Finch
- Any love interest at all
- Central mystery with more than one answer
- Beatrice speaking or having a scent
- Explicit 18+ content
- Names reused from other books (no Vance, no Clara, no Elias)
ending_book1: 'Elara rejects the final stage of transformation. Using the alpine salt
  and Beatrice''s shimmer to navigate, she fights past a partly-converted Cora and
  escapes into the winter mountains carrying Tobias''s sketchbook and a vial of the
  venom. The clinic and Finch are left behind — but Elara is permanently altered:
  colder, painless, her veins black. The threat is escaped; the dread is that she
  is now partly the thing she fled.'
hook_book2: ''
notes: '12 chapters. Standalone, no sequel. Medical gothic body horror. Male lead
  Finch is the antagonist, not a romance. Comps: Jeff VanderMeer (ecosystemic biological
  dread), Shirley Jackson (claustrophobic polite horror).'
