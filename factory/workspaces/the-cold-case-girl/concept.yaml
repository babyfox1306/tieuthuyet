chapter_map:
  1: Nadia finishes a target cleanly (reader learns she kills); podcast fame as cover;
    a detail suggests someone watched.
  2: The kill lands publicly as an "accident"; Nadia performs grief on-air; plant
    the watcher thread.
  3: New case opens — cold-case murder of Elise Marchetti; Nadia announces it; the
    guilty man Victor Rhodes walks free, untouchable.
  5: Nadia activates her network (lawyer, coroner, hacker); first evidence gathered;
    establish her rules.
  7: Nadia profiles Rhodes; sees why the system failed Elise Marchetti; commitment
    hardens.
  8: ACT 1 END — Nadia commits to finishing Rhodes; an anonymous message proves someone
    knows what she is.
  10: Nadia hunts the message's source; first sign Rhodes is not a normal target.
  11: Rhodes counters — smarter than past targets; he starts leaking pieces of Nadia's
    past to the press.
  13: The network debates the risk; loyalty tested; a rule bends.
  14: A network member is exposed / endangered; Nadia's method costs others, not just
    herself.
  16: Nadia sets up a clean kill on Rhodes; meticulous prep.
  17: The kill attempt is a trap — Rhodes wanted her to try; she barely escapes.
  19: MIDPOINT — Nadia realizes Rhodes has a case file on her FIRST kill; hunter becomes
    hunted.
  21: Nadia scrambles to find the file; her origin wound surfaces in fragments.
  22: The network fractures — someone wants out or is compromised; trust breaks.
  24: Nadia isolates the suspected leak; paranoia poisons the circle.
  25: Nadia uncovers HOW Rhodes learned about her — a leak inside her own circle,
    confirmed.
  27: Nadia strikes back, thinks she's cornered Rhodes.
  28: 'ACT 2 END — false victory flips: Rhodes reveals her first-kill evidence is
    on a dead-man''s-switch.'
  30: Nadia weighs the impossible choice; the cost of her war surfaces (origin fragments
    deepen, full reveal held for ch34).
  31: Nadia must choose — kill Rhodes and trigger exposure, or let him live and stay
    hunted.
  33: Nadia rebuilds trust with the loyal network members; a plan forms.
  34: Nadia turns Rhodes's own method against him; hunts the dead-man's-switch; network
    reunites.
  36: Final confrontation — earned through physical evidence, not confession; Rhodes
    dies, but not cleanly.
  37: Aftermath; the podcast frames it as "justice served"; loose ends tied.
  38: 'Case closes. Last beat: evidence about Nadia''s first kill surfaces in someone
    else''s hands. Book-2 hook — she''s hunted, and this time it''s personal.'
intentional_early_reveal: true
