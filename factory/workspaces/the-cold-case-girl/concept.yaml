concept_status: ready
target_language: en
title: The Cold Case Girl
logline: 'A famous true-crime podcaster built her name reopening cold cases where
  women were failed by the system — but the reader knows what her listeners don''t:
  when the law can''t touch a guilty man, she finishes the case herself. Her newest
  target is the most dangerous yet, because he''s the one person who has figured out
  exactly what she is.'
author_directive: 'LOCKED CAST — canonical names, do NOT rename, do NOT invent variants
  across chapters:

  - PROTAGONIST: Nadia Cole — true-crime podcaster, anti-hero (the executioner).

  - ANTAGONIST: Victor Rhodes — the guilty man who walked free; the two-way hunter.

  - NETWORK MEMBER 1 (the lawyer): Sasha Okafor — defense lawyer who knows which guilty
  men walked free.

  - NETWORK MEMBER 2 (the coroner): Priya Anand — medical examiner who reads (or adjusts)
  cause of death.

  - NETWORK MEMBER 3 (the hacker): Wren Delgado — pulls the digital trails.

  - THE LEAK: one of the three network members betrays Nadia (decide which at plan
  time; keep consistent once chosen).

  - ORIGIN VICTIM (Nadia''s loved one, backstory): Mara Cole — Nadia''s younger sister,
  murdered; her killer walked free. This is Nadia''s origin wound.

  - ORIGIN KILLER (Mara''s murderer, backstory; this man is Nadia''s FIRST kill):
  Julian Croft — a wealthy developer who walked free on money and connections. FIXED
  name, no variants, no alternate spellings.

  - COLD-CASE VICTIM (the murder Nadia reopens; Rhodes''s crime): Elise Marchetti
  — young woman whose unsolved murder is the podcast case that brings Nadia to Rhodes.
  FIXED name, no variants, no alternate spellings. Do NOT invent a different victim
  name.

  These names are FIXED. Every chapter, every plan beat, every narrative asset must
  use exactly these names. No "Dr. Lin", no alternate spellings, no invented characters.


  GENRE: feminist "good for her" revenge thriller. Anti-hero protagonist — the reader
  KNOWS from chapter 1 that Nadia kills; she is NOT an unreliable narrator hiding
  it. The tension is "will she get away with it / will she be caught," not "is she
  guilty." Reader roots for her because targets are guilty men the system protected,
  and the system is shown to be genuinely broken.


  PROTAGONIST — Nadia Cole:

  - Famous true-crime podcaster; public face warm, articulate, crusading. Private
  self cold, methodical, precise.

  - Origin wound: her younger sister Mara was murdered; the killer walked free on
  money and connections. This is why she does it. Reveal gradually, not all at once.

  - Rule: she only targets the provably guilty; she will NOT kill an innocent, and
  this rule will be tested.

  - She engineers "accidents" and clean frames — never sloppy, never impulsive. Competence
  is her appeal.


  ANTAGONIST — Victor Rhodes:

  - Guilty of the cold-case murder of Elise Marchetti that Nadia reopens; walked free
  once already.

  - NOT a cartoon villain. Intelligent, patient; he figures out what Nadia is — turning
  the season into a two-way hunt.

  - His weapon isn''t violence, it''s information: builds a case on Nadia''s first
  kill, rigs a dead-man''s-switch.


  STRUCTURE (38 ch, single timeline, present-day, first-person past):

  - ACT 1 (1-8): Establish method, fame, network, new target. End: someone knows what
  she is.

  - ACT 2 (9-28): Two-way hunt. Nadia closes on Rhodes; Rhodes closes on Nadia. Network
  fractures. Midpoint (ch19): hunter becomes hunted. Act-2 end (ch28): false victory
  flips.

  - ACT 3 (29-38): Nadia turns Rhodes''s method against him; final confrontation via
  physical evidence; Rhodes dies; Book-2 hook lands.


  CORE RULES:

  - Truth and victories earned through physical evidence and competence, never confession
  monologues.

  - Every 3-4 chapters: a reveal, a reversal, or a rise in threat. No flat stretches.

  - Reveal cadence for the origin/first kill: seed early, pay off across the book
  — the first-kill file is the ticking bomb.

  - Keep every character name consistent across all 38 chapters (no drift, no renaming).

  - No supernatural. Grounded, modern, procedural texture (podcast production, forensics,
  digital trails).

  - Spice: level 0-1. Charged tension possible (a detective circling her, or a network
  member), but no explicit content. Romance never drives the plot.

  - Betrayal (the network leak) must HURT — build real loyalty before it breaks.


  MUST AVOID:

  - Making Nadia an unreliable narrator who hides her killing from the reader — the
  reader knows from ch1.

  - Cartoon villain or villain monologue as the reveal mechanism.

  - Killing or endangering children; no sexual violence shown on-page.

  - Copying names, characters, or plot from any existing book (esp. any real advice-columnist-vigilante
  title).

  - Romance subplot taking over the thriller engine.

  - Do NOT create a standalone romance thread or romance plotline. Romance stays as
  faint texture only (spice 1), never a tracked narrative thread. The origin reveal
  is fully paid off at chapter 34, not earlier.

  - Flat stretches with no reveal/reversal for 4+ chapters.'
surface_plot: 'Reader thinks: Nadia Cole, a beloved investigative podcaster, reopens
  the unsolved murder of Elise Marchetti and hunts the powerful man who walked free.
  As she closes in, someone starts hunting her back — leaking her past, threatening
  her sources. A cat-and-mouse between a crusading journalist and a killer who covered
  his tracks.'
true_plot: 'Actually: Nadia is not just investigating — she is the executioner, and
  the reader knows it from chapter 1. When the system fails, she engineers clean "accidents"
  and airtight frames. Her podcast is both cover and recruitment: a hidden network
  of women (a lawyer, a coroner, a hacker) feeds her what the courts ignore. Her new
  target isn''t just guilty — he has figured out what she does and is quietly building
  the case that will expose her and unravel her network. The real question isn''t
  whether she catches him. It''s whether she can finish him before he finishes her
  — without her network, or her own buried first kill, coming to light.'
must_include:
- Anti-hero protagonist the reader knows is a killer from chapter 1
- Guilty targets the system genuinely failed to punish
- A hidden network of women, each with a distinct skill and risk
- 'A two-way hunt: the antagonist figures out what she is'
- Origin wound (a loved one failed by the law) revealed gradually
- Victories earned through competence and physical evidence, not confession
- A network betrayal that hurts because loyalty was real
- Book-1 case fully closed; series arc (the first kill) left as the ticking bomb
must_avoid:
- Unreliable narrator hiding the killing from the reader
- Cartoon villain or confession-monologue reveal
- Children in danger or on-page sexual violence
- Copying any existing advice-columnist-vigilante book
- Romance subplot driving the plot
- Supernatural or paranormal elements
- Flat stretches with no reveal or reversal for 4+ chapters
- Character name drift across chapters
ending_book1: 'Book 1 closes the Rhodes case: the man who walked free is finished,
  and the podcast frames it publicly as justice finally served. Nadia survives, her
  network mostly intact, her method proven. But she is no longer invisible — the two-way
  hunt cost her the one thing she guarded most: secrecy.'
hook_book2: The evidence Rhodes built about Nadia's very first kill did not die with
  him. In the final beat, it surfaces in someone else's hands — someone who doesn't
  want money or a story. They want Nadia to work for them. The hunter is now on a
  leash.
notes: '38 chapters, ~2800-3200 words each (target 90k-110k words total, KU thriller
  length). First-person past tense, single timeline, present-day.

  Structure: 3 acts — Act1 ch1-8, Act2 ch9-28, Act3 ch29-38. Midpoint pivot at ch19,
  Act-2 false-victory flip at ch28.

  Tone: tense, modern, procedural, morally charged. Every chapter ends on a question,
  reversal, or threat.

  Names must stay consistent across all 38 chapters (no drift).'
