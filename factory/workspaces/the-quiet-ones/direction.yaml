book1_ending: 'Book 1 closes the Kroll case: the man who walked free is finished,
  and the podcast frames it publicly as justice finally served. Elle survives, her
  network mostly intact, her method proven. But she is no longer invisible — the two-way
  hunt cost her the one thing she guarded most: secrecy.'
blurb: 'A famous true-crime podcaster built her reputation reopening cold cases where
  women were failed by the system — but the reader knows what her listeners don''t:
  when the law can''t touch a guilty man, she finishes the case herself. Her newest
  target is the most dangerous yet, because he''s the one person who knows exactly
  what she is.'
