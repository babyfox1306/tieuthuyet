book1_ending: 'Clara understands what Eleanor has become and faces the choice: save
  the archive (feed the entity) or drown it forever. She chooses to drown it — sinking
  the observatory beneath the peat bog, walking away with black vein-marks etched
  permanently into her hands. The case closes; the dread lingers.'
blurb: An archivist cataloguing a flooded Victorian observatory discovers the black
  ink threading through its stagnant water is the liquefied memory of her missing
  sister — and every record she refuses to destroy feeds it.
