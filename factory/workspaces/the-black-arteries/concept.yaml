concept_status: ready
target_language: en
title: The Black Arteries
logline: An archivist cataloguing a flooded Victorian observatory discovers the black
  ink threading through its stagnant water is the liquefied memory of her missing
  sister — and every record she refuses to destroy feeds it.
author_directive: 'POV: third-limited, locked to Clara Vance (26) for the entire book.
  Spice: 1 (no romance line at all; this is pure atmospheric gothic). NO male lead
  — do not invent any man as antagonist or love interest.


  Characters: Clara Vance (protagonist, archivist; tic: winds her brass pocket watch
  when anxious; boundary: will never destroy any written record). Eleanor Vance (the
  "dead" sister; manifests ONLY as a stain — black ink branching across paper, glass,
  or water surfaces; NEVER makes a sound and NEVER produces a scent).


  Central mystery (ONE single answer): the black ink is the preserved memory and physical
  mass of Eleanor Vance merged with an ancient bog parasite. Reveal in chapter 9.


  World rules: the ink dissolves paper into organic vascular roots; metal submerged
  in it oxidizes instantly and throws off metallic flecks of light; sunlight freezes
  the roots into brittle charcoal that crumbles.


  Forbidden: no invented male lead; the central mystery must not have two answers;
  Eleanor must never speak and must have no scent; no explicit 18+ content.'
surface_plot: A meticulous archivist arrives at a half-submerged manor to catalogue
  a drowned observatory, and slowly realizes the black stains spreading across paper,
  glass, and water are not decay but something spreading toward her.
true_plot: Her sister Eleanor didn't vanish — she dissolved herself into the estate's
  forbidden records to preserve them, merging with an ancient bog parasite. The ink
  is Eleanor, still trying to make Clara keep every page. Saving the archive means
  feeding it; destroying it means killing what's left of her sister.
must_include:
- Slow atmospheric burn every chapter
- Visual cliffhanger at the end of each chapter
- Recurring signature image of black ink / vascular roots / drifting ash
- Reveal cadence spread evenly every 2-3 chapters
must_avoid:
- Blood relation between two leads
- Invented male lead
- Central mystery with more than one answer
- Eleanor making any sound or having a scent
- Explicit 18+ content
ending_book1: 'Clara understands what Eleanor has become and faces the choice: save
  the archive (feed the entity) or drown it forever. She chooses to drown it — sinking
  the observatory beneath the peat bog, walking away with black vein-marks etched
  permanently into her hands. The case closes; the dread lingers.'
hook_book2: ''
notes: '12 chapters. Standalone, no sequel. Pure atmospheric gothic horror, no romance.
  Comps: The Woman in Black, What Moves the Dead, Mexican Gothic.'
