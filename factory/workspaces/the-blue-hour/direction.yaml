id: the-blue-hour
pen_name: Reynard Frost
book: 1
blurb: A woman returns to the lake house where she spent one childhood summer she
  cannot remember, and finds a one-eyed bear waiting for her — along with a small
  girl in a blue dress who only appears in mirrors, who never speaks, and who does
  not want her to leave a second time.
book1_ending: 'Elena recovers the full memory of the day Tomas drowned — what she
  did, what she failed to do, and the guilt she buried by splitting herself. She makes
  her choice at the water''s edge: she takes the girl in blue back, becomes whole,
  and chooses to live knowing. The central mystery is fully answered; her arc resolves.'
