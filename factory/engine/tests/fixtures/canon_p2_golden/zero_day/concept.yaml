schema_version: '1.0'
concept_status: ready
target_language: en
title: The Zero-Day Alibi
pen_name: Nix Vale
romance_mode: 'on'
spice_level: 0
spice_default: 0
spice_schedule: {}
pov:
  character: Mara Voss
  mode: first_person
  tense: past
  single_pov: true
canonical_reveal_chapter: 9
corpse_reveal_chapter: 5
chapter_count: 12
intentional_early_reveal: false
author_directive: 'Tone: clinical, hyper-competent, cold to the point of pain. Every chapter is a counter-move.'
logline: When an expert who creates alibis from ordinary digital traces is forced to conceal a murder for a mysterious client, she discovers that she is the mastermind who hired him—and that he knew from the beginning and took the bait to seize her black-data vault.
surface_plot: Mara believes Adrian killed Claire Thorne and is using a Crisis Management contract to force Mara to create an alibi, with twenty-four hours before police discover Claire's death.
true_plot: Mara Voss secretly hired Adrian Thorne to kill Claire Thorne and planned to frame Adrian while taking Claire's shares. Adrian knew Mara was the mastermind before entering the office and needs Mara to open the Zero-Day Server. Both believe they hold the final leverage.
ending_book1: Claire's death remains an open homicide investigation because the ghost vehicle and altered smartwatch prevent a suicide ruling. No arrest is made yet; Mara and Adrian enter a conditional partnership while both remain exposed.
hook_book2: Det. Miller escalates the unresolved homicide inquiry after finding a second inconsistency in Claire's smartwatch log, forcing Mara and Adrian to coordinate their next counter-move.
psychological_condition:
  canonical: prolonged acute stress under cortisol and sleep deprivation
  observable_effects:
  - shaking hands during loss of control
  - dry-heaving under adrenaline
  - heart rate reaching 160
  - blurred vision and bloodshot eyes
  must_not_be_described_as:
  - shaking from romantic feeling
  - physical knife wounds
character_psychology:
- character: Mara Voss
  core_traits:
  - Alibi Architect
  - Clinically hyper-competent and cold
  - Overconfident in OSINT skill
  core_need: To maintain absolute control over her constructed reality
  core_fear: That her control is an illusion, that she has been a tool rather than the architect
  coping_mechanism: Systematic compartmentalization and technical precision to mask psychological fragility
  stress_responses:
  - Cortisol-induced physical stress
  - Sleep deprivation
  - Shaking hands
  - Vomiting
  - Arrhythmic heart rate
  cognitive_dissonance: Believes Adrian is a tool while being used by him as a predator
  behavioral_constraints:
  - Does not use physical violence
  - Does not leave the office during the 24-hour story
  - Data vault is not physically destroyed
  - Shaking always signifies loss of control, never romantic emotion
  reveal_gated_fields:
  - field: core_trait
    value: Alibi Architect and hidden mastermind
    unlock_reveal_id: R3
- character: Adrian Thorne
  core_traits:
  - Digital predator
  - Cooperates perfectly with Mara's alibi creation, masking his true intentions
  - Smiles when his knowledge or control is discovered
  core_need: To seize ultimate control by acquiring the black-data vault, proving his digital superiority.
  core_fear: That his true goal will be preempted, leaving him with only the alibi—a tool he never needed.
  coping_mechanism: Meticulous digital preparation and theatrical compliance, using staged evidence and withheld countermeasures to maintain psychological leverage.
  stress_responses:
  - Cortisol-induced physical stress
  - Sleep deprivation
  - Exhaustion, bloodshot eyes
  - Shaking under sustained tension
  - Shaking hands (signifies loss of control)
  - Dry-heaving
  cognitive_dissonance: Knows he is using Mara as a tool to access her vault, while allowing her to believe she is the architect trapping him.
  behavioral_constraints:
  - Does not use physical violence against Mara
  - Does not threaten to kill Mara
  - Never leaves the office during the 24-hour story (implied co-presence)
  - Maintains perfect cooperation until the final leverage is revealed
  reveal_gated_fields: []
villain_ledger:
- action: In the opening stretch Adrian knows Mara is the mastermind but does not know she shifted the time of death.
  phase: opening
- action: In the middle stretch Adrian knows Mara is building the ghost-vehicle frame and deliberately lets it run because he retains a signed forensic snapshot proving her workstation generated it; he withholds that countermeasure until it can force her to open the Zero-Day Server.
  phase: middle
- action: In the final stretch Adrian knows Mara found the backdoor but does not know she will offer partnership.
  phase: final
characters:
- name: Mara Voss
  role: protagonist / Alibi Architect
- name: Adrian Thorne
  role: antagonist and love interest / Claire's husband / digital predator
- name: Claire Thorne
  role: victim / Adrian's wife / absent corpse
- name: Det. Miller
  role: incidental investigator / alibi verifier / Book 2 hook
