    primary_turn: Mutual assured destruction becomes alliance.
    must_not_happen:
    - A conventional romantic surrender.
    spice_level: 0
must_include:
- The bloody phone in the opening and its return in the climax.
- Every chapter contains a counter-move.
must_include_by_chapter:
  '1':
  - The bloody phone.
  '7':
  - Adrian's smile when discovered.
  '9':
  - Adrian's smile when discovered.
  '12':
  - The bloody phone returns.
  - Adrian's smile when discovered.
  '8': []
  '10': []
must_avoid:
- Mara or Adrian uses physical violence against the other.
- Adrian threatens to kill Mara.
- The data vault is physically destroyed.
- Shaking caused by romantic feeling.
notes: 'Clinical, hyper-competent, cold to the point of pain. Dark romance is Mutual Assured Destruction. Trope: Zero-Trust Romance. Tropes: Mutual Digital Predation / Competence Porn.'
threshold_events:
- ordinal: 1
  chapter: 1
  event_type: first_threshold
  resistance:
  - Maintains clinical detachment by categorizing physical evidence as data points
  - Systematically processes the blood as a forensic variable rather than an emotional trigger
  hesitation: A brief freeze as her body registers the contradiction between her clinical plan and its bloody execution
  body_response:
  - Wrist shakes while holding the bloody phone
  immediate_aftermath:
  - Completes the cleanup with exaggerated precision
  - Files the incident as 'contained' in her mental log
  downstream_change:
  - Initiates more aggressive control measures
  - Catalogs the blood incident as a data point requiring additional security layers
  confidence_shift: Shaken but recalibrating
  control_shift: First crack in the illusion of total control
  psychological_cost: Recognition that even clinically perfect plans encounter unpredictable physical variables
- ordinal: 2
  chapter: 5
  event_type: repeat
  resistance:
  - Reluctance to complicate her own architecture
  - Concern that creating false evidence could expose her methodology
  hesitation: Weighs the risk of creating a decoy against the risk of the original plan failing
  body_response:
  - Subtle increase in resting heart rate
  - Brief episode of lightheadedness from sleep deprivation
  immediate_aftermath:
  - traffic camera manipulation setup
  - Verifies forensic consistency of the altered timeline
  downstream_change:
  - The trap becomes an active variable Adrian can potentially detect
  - Increases her psychological investment in outsmarting her unseen opponent
  confidence_shift: High; believes this demonstrates mastermind-level foresight
  control_shift: Asserting control through complexity rather than simplicity
  psychological_cost: Acceptance that her work now includes deliberate deception of systems she respects
- ordinal: 3
  chapter: 7
  event_type: repeat
  resistance:
  - Attempts to rationalize it as a test or bluff
  - Seeks technical explanations for the information leak
  hesitation: A prolonged silence as her mental model of the situation crashes and reboots
  body_response:
  - Hands shake violently
  - Mouth dries
  - Cortisol spike triggers nausea
  immediate_aftermath:
  - Voice remains steady despite physical tremor
  - Shifts the conversation to terms and conditions
  downstream_change:
  - server mentions, data vault references
  - Initiates a frantic internal audit of all her systems
  confidence_shift: Shattered; performing competence while internally reeling
  control_shift: Illusory; she is following his script while pretending to lead
  psychological_cost: The humiliation of being the observed, not the observer
- ordinal: 4
  chapter: 10
  event_type: repeat
  resistance:
  - Instinct to hoard the key personally
  - Distrust of biometric binding as a single point of failure
  hesitation: Assesses the binding as the only security measure that cannot be compromised without her biological termination
  body_response:
  - Heightened awareness of her own heartbeat
  - Dryness in throat from focused breathing
  immediate_aftermath:
  - A cold, profound calm settles over her
  - The arrhythmic palpitations momentarily steady
  downstream_change:
  - Creates a permanent, physiological tie to her creation
  - Forces Adrian to accept her continued existence as a necessity
  confidence_shift: Resolute; confidence born of having nothing left to lose
  control_shift: Symbiotic; control is now shared and conditional on her biological continuity
  psychological_cost: The final relinquishment of the fantasy of clean, detached control
- ordinal: 5
  chapter: 12
  event_type: repeat
  resistance:
  - Last vestiges of the desire for solitary mastery
  - Disgust at partnering with the predator who manipulated her
  hesitation: A final, silent review of the power balance spreadsheet in her mind
  body_response:
  - Heart rate normalizes to a steady, elevated rhythm
  - Hands remain completely still
  immediate_aftermath:
  - Signs the virtual contract with a sense of grim finality
  - The constant cortisol hum diminishes to a manageable level
  downstream_change:
  - The Zero-Day Server becomes a jointly managed asset
  - Her identity shifts from hidden mastermind to acknowledged partner-in-crime
  confidence_shift: Calculated; confidence based on verified mutual dependency, not overestimation
  control_shift: Negotiated and conditional; control is a function of the agreement, not personal dominion
  psychological_cost: Acceptance that her competence is relational, not absolute
arc_shape:
  type: loss_of_control
  source: locked_ending_state
  monotonic: true
