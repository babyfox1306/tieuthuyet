id: kill-me-if-i-remember
pen_name: Nix Vale
blurb: A firearms investigator wakes on a rooftop beside her sister's body with three
  months missing from her mind, and the masked assassin standing over her says she
  hired him — then hands her a contract in her own handwriting that orders her death
  at sunrise, while the hidden condition governing that order remains buried with
  Rook.
