id: the-cold-case-girl
pen_name: Nix Vale
blurb: 'A famous true-crime podcaster built her name reopening cold cases where women
  were failed by the system — but the reader knows what her listeners don''t: when
  the law can''t touch a guilty man, she finishes the case herself. Her newest target
  is the most dangerous yet, because he''s the one person who has figured out exactly
  what she is.'
