id: the-second-wife
pen_name: Reynard Frost
blurb: When a live-in housekeeper takes a job caring for a wealthy man's fragile wife,
  she's certain she's there to save the woman from him — until she realizes the wife
  hired her for something else entirely, and neither of them is who they claimed to
  be.
